<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ error_title or "Error" }} | ELEVATION</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div style="text-align: center; max-width: 480px; padding: 32px; background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    <div style="font-size: 42px; font-weight: 800; color: var(--primary); margin-bottom: 8px;">404</div>
    <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">{{ error_title or "Page Not Found" }}</h1>
    <p style="color: var(--text-secondary); margin-bottom: 24px; font-size: 14px;">
      {{ error_message or "The page or record you are looking for does not exist." }}
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
      Return to Dashboard
    </a>
  </div>
</body>
</html>
